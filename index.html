<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

  <link rel="stylesheet" crossorigin href="/construction-sim/assets/index-CJdD3ngg.css">
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>

  <header id="hud-top">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>AUTO&shy;ERECT</h1>

    <div id="val-body"></div>

  <footer id="hud-foot">
    <span id="foot-status">Initialising physics…</span>

  <div id="report-overlay" class="hidden">
    <div id="report-card">
      <h2 id="report-title">TOWER B — ERECTION COMPLETE</h2>
